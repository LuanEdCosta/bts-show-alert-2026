<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="BTS Alerta">
    <meta name="theme-color" content="#024ddf">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <title>BTS Alerta</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #0e1116; color: #f4f7fb; }
      body { margin: 0; }
      main { max-width: 420px; margin: 0 auto; padding: 28px 20px 48px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p, li { line-height: 1.5; color: #d5deea; }
      button, textarea { font: inherit; }
      button { width: 100%; border: 0; border-radius: 999px; background: #024ddf; color: white; padding: 14px 16px; }
      button:disabled { opacity: 0.6; }
      textarea { width: 100%; box-sizing: border-box; min-height: 180px; margin-top: 16px; background: #161c25; color: inherit; border: 1px solid #314158; border-radius: 12px; padding: 12px; }
      .warn { color: #ffb020; }
      .ok { color: #7dffa8; }
    </style>
  </head>
  <body>
    <main>
      <h1>BTS Alerta</h1>
      <p id="status">Preparando os avisos neste iPhone.</p>
      <ol id="steps">
        <li>No Safari, toque em Compartilhar.</li>
        <li>Toque em Adicionar à Tela de Início.</li>
        <li>Deixe “Abrir como App Web” ligado.</li>
        <li>Abra o ícone novo. Nesta aba do Safari o botão continua bloqueado.</li>
      </ol>
      <button id="enable" type="button">Ativar avisos</button>
      <textarea id="subscription" readonly hidden></textarea>
    </main>
    <script>
      const status = document.querySelector("#status");
      const steps = document.querySelector("#steps");
      const button = document.querySelector("#enable");
      const output = document.querySelector("#subscription");
      const publicKey = loadKey();
      const standalone = navigator.standalone === true
        || window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
      const canNotify = "Notification" in window && ("PushManager" in window || "pushManager" in window);
      const iosSafari = "standalone" in navigator && navigator.standalone === false && !("Notification" in window);

      if (location.protocol !== "https:") {
        block("Publique esta pasta num endereço https e abra esse endereço no iPhone.");
      } else if (!publicKey) {
        block("Abra o link gerado pela extensão. Se o ícone já está na Tela de Início, apague-o, abra esse link no Safari e adicione outra vez.");
      } else if (iosSafari || !canNotify) {
        block(standalone
          ? "Atualize o iPhone para o iOS 16.4 ou mais novo e abra pelo ícone da Tela de Início."
          : "Nesta aba do Safari o botão fica bloqueado. Abra o ícone BTS Alerta na Tela de Início. Se ele abrir o Safari de novo, apague o ícone e adicione outra vez com “Abrir como App Web” ligado.");
      } else {
        status.textContent = "Toque em Ativar avisos e aceite o pedido do iPhone.";
        steps.hidden = true;
        button.disabled = false;
      }

      const ready = "serviceWorker" in navigator
        ? navigator.serviceWorker.register("./sw.js").then(() => navigator.serviceWorker.ready)
        : Promise.resolve(null);
      ready.then(() => pointManifest(publicKey)).catch(() => {});

      button.addEventListener("click", async () => {
        button.disabled = true;
        try {
          const permission = await Notification.requestPermission();
          if (permission !== "granted") throw new Error("O iPhone não autorizou os avisos");
          const registration = await ready;
          const pushManager = registration?.pushManager || window.pushManager;
          if (!pushManager) throw new Error("Abra esta página pelo ícone da Tela de Início.");
          const subscription = await pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: b64urlToBytes(publicKey),
          });
          output.hidden = false;
          output.value = JSON.stringify(subscription);
          status.textContent = "Copie a inscrição e cole na extensão.";
          status.className = "ok";
          await navigator.clipboard.writeText(output.value).catch(() => {});
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : String(error);
          status.className = "warn";
          button.disabled = false;
        }
      });

      function block(message) {
        status.textContent = message;
        status.className = "warn";
        button.disabled = true;
      }

      function loadKey() {
        const fromUrl = new URLSearchParams(location.search).get("k")
          || new URLSearchParams(location.hash.slice(1)).get("k")
          || "";
        if (isKey(fromUrl)) {
          // O ícone abre pelo start_url e perde a chave. O Safari copia este cookie ao adicionar à Tela de Início.
          const secure = location.protocol === "https:" ? "; Secure" : "";
          document.cookie = `bts_vapid=${fromUrl}; Path=/; Max-Age=31536000; SameSite=Lax${secure}`;
          const url = new URL(location.href);
          if (url.searchParams.get("k") !== fromUrl) {
            url.searchParams.set("k", fromUrl);
            history.replaceState(null, "", url);
          }
          return fromUrl;
        }
        const saved = document.cookie.match(/(?:^|; )bts_vapid=([^;]*)/);
        const fromCookie = saved ? decodeURIComponent(saved[1]) : "";
        return isKey(fromCookie) ? fromCookie : "";
      }

      function isKey(value) {
        return /^[A-Za-z0-9_-]{40,}$/.test(value);
      }

      async function pointManifest(key) {
        if (!isKey(key) || !("serviceWorker" in navigator)) return;
        if (!navigator.serviceWorker.controller) {
          await new Promise((resolve) => {
            const finish = () => resolve();
            navigator.serviceWorker.addEventListener("controllerchange", finish, { once: true });
            setTimeout(finish, 4000);
          });
        }
        if (!navigator.serviceWorker.controller) return;
        const link = document.querySelector('link[rel="manifest"]');
        if (link) link.href = `manifest.webmanifest?k=${key}`;
      }

      function b64urlToBytes(value) {
        const padded = value.replace(/-/g, "+").replace(/_/g, "/");
        const pad = padded + "=".repeat((4 - (padded.length % 4)) % 4);
        const binary = atob(pad);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }
    </script>
  </body>
</html>
